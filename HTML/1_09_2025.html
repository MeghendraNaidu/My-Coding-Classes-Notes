<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .grand-container{
    position: absolute;
    width: 500px;
    height: 500px;
    border: 2px solid blue;
    bottom: 0;
    }
    .container{
    width: 300px;
    height: 300px;
    border: 2px solid;
    position: relative;
    bottom: 100px;
   
    }
    .child{
    width: 80px;
    height: 80px;
    border: 2px solid red;
     position: relative;
   top: 100px;
   left: 100px;
    } 
    .container{
    width: 300px;
    height: 150px;
    border: 2px solid red;
    position: relative;
    }
    img{
    width: 100%;
    height: 100%;
    }
    p{
    position: absolute;
    top: 0px;
    margin: 0px;
    background-color: black;
    color: white;
    padding: 7px;
    }
    </style>
</head>
<body>
    <!-- 
        Positions
        ----------
        Five Properties
        1. Static - default 
        2. Absolute
        3. relative
        4. Sticky
        5. Fixed

        top = "value"    This values won't apply for static
        bottom = "value"
        rigth = "value"
        left = "value"

        Syntax:
        selector{
        position:staic, absolute, relative, sticky, fixed;  
        top = "value"
        bottom = "value"
        rigth = "value"
        left = "value"
        }
    -->

    <div class="grand-container">
        <div class="container">
            <div class="child"></div>
        </div>
    </div>

    <div class="container">
        <img src="https://www.w3schools.com/w3images/house5.jpg" alt="">
        <p>Summer House</p>
    </div>
</body>
</html>
