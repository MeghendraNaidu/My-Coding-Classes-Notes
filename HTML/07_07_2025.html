1. What is Web Page ?
A web page is a single document on the internet that can be viewed in a web browser like Google Chrome, 
Firefox, Safari, or Edge. It is usually written in HTML (HyperText Markup Language).

2. What is Website ?
A website is a collection of related web pages that are grouped together and accessed through a common domain 
name (like www.google.com, www.facebook.com, etc.). It is hosted on a web server and can be viewed using a web browser.

3. What is meant by web application ?
A web application is a software program that runs on a web server and is accessed through a web browser using 
the internet. Unlike a regular website (which mostly shows information), a web application is interactive 
— users can log in, fill forms, upload files, shop, play games, and more.

4. What is URL ?
A URL (Uniform Resource Locator) is the address of a web page or file on the internet. Just like your home 
has a street address, every resource (like a web page, image, or file) on the web has a URL so that 
browsers know where to find it.

5. What is meant by Domain ?
A domain (or domain name) is the human-readable address of a website on the internet. It’s what you 
type into your browser’s address bar to visit a website.

6. What is www. ?
www stands for World Wide Web. It is a subdomain used at the beginning of many website addresses. It’s part 
of the domain name and was originally used to indicate that the address points to a website on the World Wide Web.

.com is know as Top level Domain
7. What is meant by Hyper Text ?
Hypertext is text that contains links to other texts. It allows users to navigate from one piece of 
information to another through clickable links, usually on a web page.

8. What is Markup Language ?
A markup language is a computer language used to structure, format, and describe elements within a 
document, especially text. It uses tags or codes to "mark up" the content, indicating how it 
should be displayed or interpreted.
