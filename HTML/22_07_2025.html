<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <!--
    textarea, select, option, optgroup, checkbox, 
    placeholder, autofocus, value, disabled, multiple, accept, disabled selected, label attribute, enctype=multipart/form-data,
    In submit we can change the value
    multiple is for selecting multiple files
    accept is for selecting particular file Ex: .pdf, .doc, .png etc...
    In textarea not to use width we use rows and columns
    -->

    <form action="">
        <input type="text" placeholder="Email or Username" name="username or email" autofocus>
        <br>

        <input type="password" placeholder="password" name="password">
        <br>

        <input type="submit" value="Log-IN">
    </form>
    <!-- Multi media tag
        video
        audio
    -->
    <!--
    Tag :- source, 
    Attrite :- Controls, autoplay, mute, loop, type="audio/mp3" it is not mandatory, 
    -->
    <audio src="" controls></audio>

    </details> -->
