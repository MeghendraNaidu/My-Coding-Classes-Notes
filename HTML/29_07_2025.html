    "." any keybord
    ".+"
    "\d" 0-9

    "{start, end}"
    "[9876]" in side a square ant one cha - 9|8|6|7
    "[\d]{9}"

    ------- Pin Code Validation--------------
    "500009"

    -----------Email validation------------------
    abc@gmail.com
    abc,abc@gmail.com
    abc123@gmail.com
    abc_abc@gmail.com
    .in, .gov, .io, .edu, .org
    "(in | gov | io | com | org | edu)"
    "(yahoo | outlook | gmail)"

    "@gmail"            "gmail or (yahoo | outlook | gmail)"
    "[a-z\d._]+@(yahoo | outlook | gmail)\.(in | gov | io | com | org | edu)" email validation "com or (in | gov | io | com | org | edu)"
    -->
    <input type="text" pattern="\+91[9876][\d]{9}">
