    <!-- Pattern -->
    <!-- 
    pattern => "." -any value inside a keyboard exp new line
            => "[abc]" any one value inside []
            => "[abc]+" we can enter n no of times of "abc" execpt this remaining are not possible
            => "[aabcdefghijklmnopqrstuvwxyz]+"
            => "[a-z]" here "-" refers to "to"
            => "^" start
            => "[^a-z]" here "^" refers to the Execpt that values
            => "$" end
            => "[A-Z]"
            => "[^A-Z]"
            => "[0-9]"
            => "/d" it for numbers from "0-9"
            => " "
    -->

    <form action="">
        <input type="text" title="" pattern="[a-z A-Z 0-9]" placeholder="">
        <input type="submit">
    </form>
